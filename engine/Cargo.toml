[workspace]
members = [
    "crates/runa-telemetry",
    "crates/runa-audio",
    "crates/runa-net",
    "crates/runa-video",
    "crates/runa-gamestream",
    "crates/runa-engine",
    "crates/runa-engine-cli",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug = true
