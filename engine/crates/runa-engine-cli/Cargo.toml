[package]
name = "runa-engine-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
runa-engine = { path = "../runa-engine" }
runa-audio = { path = "../runa-audio" }
runa-net = { path = "../runa-net" }
runa-video = { path = "../runa-video" }
runa-gamestream = { path = "../runa-gamestream" }
sha2 = { version = "=0.10.9" }
webrtc = { version = "=0.12.0" }
bytes = { version = "=1.12.1" }
tokio = { version = "=1.54.1", features = ["full"] }
tracing = { version = "=0.1.44" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
