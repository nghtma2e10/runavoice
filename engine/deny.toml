[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = [
    { name = "gpl" },
    { name = "agpl" },
    { name = "lgpl" },
]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.3.3 in webrtc-dtls
    "RUSTSEC-2026-0387", # crypto-bigint in webrtc-dtls p256
    "RUSTSEC-2026-0441", # pin-utils in nix 0.26
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
